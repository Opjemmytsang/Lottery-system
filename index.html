<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>分行主管聯歡晚宴 壓軸幸運大抽獎</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", "微軟正黑體", Arial, sans-serif;
      background: #f7f7f7;
      text-align: center;
      padding: 60px 20px;
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
    }
    h1 {
      color: #333;
      font-size: 48px;
      margin-bottom: 20px;
      line-height: 1.2;
      white-space: pre-wrap;
      cursor: pointer;
      user-select: none;
    }
    h1:hover {
      color: #0078d7;
    }
    h1.paused {
      color: #999;
    }
    p { font-size: 28px; margin-bottom: 40px; }
    .button-container {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      margin: 30px 0;
    }
    button {
      padding: 16px 40px;
      font-size: 28px;
      cursor: pointer;
      color: white;
      border: none;
      border-radius: 10px;
      font-family: "Microsoft JhengHei", "微軟正黑體", Arial, sans-serif;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    #drawBtn { background-color: #0078d7; }
    #drawBtn:hover { background-color: #005a9e; }
    #resetBtn { background-color: #e74c3c; }
    #resetBtn:hover { background-color: #c0392b; }
    #winnersBtn { background-color: #27ae60; }
    #winnersBtn:hover { background-color: #219653; }
    button:disabled { background-color: #aaa !important; cursor: not-allowed; box-shadow: none; }

    #display {
      margin: 40px 0;
      font-size: 60px;
      font-weight: bold;
      color: #2d3436;
      min-height: 100px;
      letter-spacing: 4px;
    }

    #winner {
      margin: 60px 0 40px;
      font-size: 48px;
      color: #d6336c;
      font-weight: bold;
      min-height: 80px;
      opacity: 0;
      transform: scale(0.9);
      transition: all 0.6s ease-out;
    }

    #winner.show {
      opacity: 1;
      transform: scale(1.05);
      animation: pulse 1s alternate 3;
    }

    @keyframes pulse {
      from { transform: scale(1.0); text-shadow: 0 0 15px #ff6b6b; }
      to   { transform: scale(1.15); text-shadow: 0 0 40px #ff4757, 0 0 60px #ff4757; }
    }

    #remaining { font-size: 28px; color: #555; margin-top: 30px; }

    audio { display: none; }

    @media (orientation: landscape) {
      body { padding: 40px 60px; }
      h1 { font-size: 52px; }
      #display { font-size: 70px; }
      #winner { font-size: 56px; }
    }
  </style>
</head>
<body>
  <h1 id="title">🎉分行主管聯歡晚宴壓軸幸運大抽獎🎉</h1>
  <p>按「開始抽獎」進行抽獎</p>

  <!-- 背景音樂 -->
  <audio id="bgMusic" loop preload="auto">
    <source src="Background-Music.mpeg" type="audio/mpeg">
  </audio>

  <!-- 抽獎音效 -->
  <audio id="drumRoll" preload="auto">
    <source src="drumroll.mp3" type="audio/mpeg">
  </audio>
  <audio id="winSound" preload="auto">
    <source src="win-cheer.mp3" type="audio/mpeg">
  </audio>

  <div class="button-container">
    <button id="drawBtn" onclick="startDraw()">開始抽獎</button>
    <button id="resetBtn" onclick="resetDraw()">重設抽獎</button>
    <button id="winnersBtn" onclick="showWinners()">查看得獎名單</button>
  </div>

  <div id="display"></div>
  <div id="winner"></div>
  <div id="remaining">剩餘人數：計算中...</div>

  <script>
    const STORAGE_KEY = "luckyDrawRemainingNames";
    const WINNERS_KEY = "luckyDrawWinners";  // 新增：儲存得獎名單到 localStorage

    const originalNames = [
    "集團 王巧陽","集團 黃蘭詩","金至尊 Irene","金至尊財務總裁 陳卓謙","集團 張卓堅",
"集團 林華","集團 陳素娟","集團 黃蘇娟","集團 徐守瑜","TS6 周治中","集團 鍾惠冰",
"集團 黃偉棠","SS1 勞俊諺","TM1 吳沛權","TF1 邱志明","CWC 李金鈕",
"MA4 姚文成","採購部(鑽石) 蔡麗華","採購部(成品) 彭永權","採購部(鑽石) 余錦池",
"採購部(素金) 譚偉賢","產品拓展部 陳靜賢","物業部 張智強","人力資源部 黎佩瑜",
"業務部(海外) 劉偉倫","培訓部 陳可賢","電子商務部 陳海晴","公司秘書部 邱清微",
"財會部(資金管理) 吳敏儀","財會部 黃嘉熙","財會部(管理會計) 蕭仲賢",
"財會部(財務會計) 蕭凱榮","採購部(玉器) 李宛蓉","企業禮品部 曾一婷",
"編貨部 曾家寶","企業傳訊部 吳靜雯","珠寶設計部 區國文","資訊科技部 黎其琼",
"資訊科技部(硬件) 林曦明","室內設計部 趙穎璋","影音視像部 郭亦升",
"店舖稽核部 李兆麟","營運部 陳志豪","集團 Johnny","KF1 黃秀娟","MO1 朱國強",
"SS2 李祥江","ST5 黃文鋒","ST6 張漢威","TC1 莊銘塨","TP1 鄧展鵬",
"TY1 李漢熙","WF1 柯誌泰","JD6 吳厚默","MK1 郭劍峰","MK2 馮子泉",
"MK7 王生偉","MK8 陳峰雲","MKC 何川","MKD 戴玲玲","MKE 劉世傑",
"MKF 陳小琪","MKG 李雅雲","NC1 麥錦燦","TSA 吳惠蓉","TSB 余健林",
"TSC 陳卓君","UK1 王汛鏸","TM3 陳志偉","TM4 鄭志建","TW1 楊凱帆",
"TW2 鄭志文","TW4 曾昭樑","TW5 許栢祺","YL4 關雪儀","YL5 梁維昌",
"KL1 杜坤成","SGO 莊偉平","TK2 高文禮","TK3 鄭偉華","TK4 郭志強",
"TK5 李淑芬","WT1 李小軍","CW4 陳少玲","CWD 周慶釗","NP4 吳凝琦",
"NP5 陳秋明","WC1 張志傑","MA5 翁卓敬","MA6 盧熾球","MA8 彭可昌",
"MA9 何國雄","MAA 施銘山","MAF 張國棟","MAH 吳文林","MAJ 歐廣文",
"MAM 毛展強","MAO 余國雄","MAP 林兆強","MAQ 葉沛達","MAR 鄧偉傑",
"MAS 王展鵬","MAU 劉國賢","MAV 楊耀生","MAW 黃雪盈","金至尊 陳子倫",
"金至尊 楊振民","金至尊 杜兆榮","金至尊 葉家麗","金至尊 林悅彬","金至尊 陳藝蘭"
    ];

    let names = [];
    let winners = [];  // 儲存得獎名單

    // 載入剩餘名單
    const savedNames = localStorage.getItem(STORAGE_KEY);
    if (savedNames) {
      try {
        names = JSON.parse(savedNames);
      } catch (e) {
        names = [...originalNames];
      }
    } else {
      names = [...originalNames];
    }

    // 載入已抽中的得獎名單
    const savedWinners = localStorage.getItem(WINNERS_KEY);
    if (savedWinners) {
      try {
        winners = JSON.parse(savedWinners);
      } catch (e) {
        winners = [];
      }
    }

    const display = document.getElementById("display");
    const winnerDiv = document.getElementById("winner");
    const remainingDiv = document.getElementById("remaining");
    const drawBtn = document.getElementById("drawBtn");
    const drumRoll = document.getElementById("drumRoll");
    const winSound = document.getElementById("winSound");
    const bgMusic = document.getElementById("bgMusic");
    const title = document.getElementById("title");

    function saveRemaining() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(names));
    }

    function saveWinners() {
      localStorage.setItem(WINNERS_KEY, JSON.stringify(winners));
    }

    function updateRemaining() {
      remainingDiv.innerText = "剩餘人數：" + names.length;
      saveRemaining();
    }

    function toggleBackgroundMusic() {
      if (bgMusic.paused) {
        bgMusic.volume = 0.3;
        bgMusic.play().catch(e => {
          console.log("背景音樂播放失敗", e);
          alert("請再次點擊標題啟動背景音樂（Safari/iPad 需要互動）");
        });
        title.classList.remove("paused");
      } else {
        bgMusic.pause();
        title.classList.add("paused");
      }
    }

    function startDraw() {
      if (names.length === 0) {
        winnerDiv.innerText = "🎊 所有人都已經抽過了！ 🎊";
        winnerDiv.classList.add("show");
        drawBtn.disabled = true;
        return;
      }

      bgMusic.pause();
      title.classList.add("paused");

      drawBtn.disabled = true;
      winnerDiv.classList.remove("show");
      winnerDiv.innerText = "";

      drumRoll.currentTime = 0;
      drumRoll.play().catch(e => console.log("鼓聲播放失敗", e));

      const TOTAL_DURATION = 2980;
      const INTERVAL = 60;
      let startTime = Date.now();

      const shuffleInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        if (elapsed >= TOTAL_DURATION) {
          clearInterval(shuffleInterval);
          drumRoll.pause();

          const index = Math.floor(Math.random() * names.length);
          const winner = names.splice(index, 1)[0];

          // 記錄得獎者
          winners.push(winner);
          saveWinners();

          display.innerText = winner;
          winnerDiv.innerText = "🎊 恭喜 " + winner + " 🎊";
          winnerDiv.classList.add("show");

          winSound.currentTime = 0;
          winSound.play().catch(e => console.log("勝利音效播放失敗", e));

          winSound.onended = function() {
            bgMusic.play().catch(e => console.log("恢復背景音樂失敗", e));
            title.classList.remove("paused");
          };

          updateRemaining();
          drawBtn.disabled = false;
          return;
        }

        const randomName = names[Math.floor(Math.random() * names.length)];
        display.innerText = randomName;
      }, INTERVAL);
    }

    // 查看得獎名單
    function showWinners() {
      if (winners.length === 0) {
        alert("暫無得獎名單");
        return;
      }

      let message = "得獎名單（按抽出順序）：\n\n";
      winners.forEach((name, index) => {
        message += `${index + 1}. ${name}\n`;
      });

      alert(message);
    }

    function resetDraw() {
      if (confirm("確定要重設抽獎？所有已抽過的名單及得獎記錄將清除！")) {
        names = [...originalNames];
        winners = [];  // 清空得獎名單
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(WINNERS_KEY);
        display.innerText = "";
        winnerDiv.innerText = "";
        winnerDiv.classList.remove("show");
        drawBtn.disabled = false;
        drumRoll.pause();
        winSound.pause();
        bgMusic.pause();
        title.classList.add("paused");
        updateRemaining();
        alert("抽獎及得獎記錄已重設完成！");
      }
    }

    title.addEventListener("click", toggleBackgroundMusic);

    updateRemaining();
  </script>
</body>
</html>
